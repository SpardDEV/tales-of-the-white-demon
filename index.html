<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d1624" />
  <title>Tales of the White Demon</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <!-- HEADER + QUOTA BARS -->
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <span class="brand-icon">❄️</span>
          <div>
            <div class="brand-title">Tales of the White Demon</div>
            <div id="header-sub" class="brand-sub">Rank F · Lv. 1 · Cap. 1</div>
          </div>
        </div>
        <div class="topbar-actions">
          <span id="sync-badge" class="badge badge-muted" title="Status de sincronização">Local</span>
          <button id="btn-open-settings" class="icon-btn" title="Configurações & API">⚙️</button>
        </div>
      </div>

      <!-- CONSUMPTION BARS (GEMINI & SUPABASE) -->
      <div class="quota-strip" id="quota-strip" title="Toque para detalhes de consumo">
        <div class="quota-item">
          <div class="quota-label">
            <span>🤖 Gemini (Dia)</span>
            <span id="gemini-quota-text">0 / 250 req · 0 tok</span>
          </div>
          <div class="progress-track">
            <div id="gemini-quota-bar" class="progress-fill fill-ice" style="width: 0%"></div>
          </div>
        </div>
        <div class="quota-item">
          <div class="quota-label">
            <span>🗄️ Supabase</span>
            <span id="supabase-quota-text">0.00 / 500 MB</span>
          </div>
          <div class="progress-track">
            <div id="supabase-quota-bar" class="progress-fill fill-mana" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT PANELS -->
    <main class="main-panels">
      <!-- TAB: CHAT -->
      <section id="tab-chat" class="panel active">
        <div id="prologue-banner" class="banner hidden"></div>
        <div id="chat-log" class="chat-log"></div>

        <!-- NEGOTIATION / STUBBORNNESS BAR -->
        <div id="negotiation-box" class="negotiation-box hidden">
          <div class="negotiation-title" id="negotiation-title">⚖️ Negociação do Sistema</div>
          <div class="negotiation-desc" id="negotiation-desc"></div>
          <div class="negotiation-actions">
            <button id="btn-neg-accept" class="btn btn-ice btn-sm">✅ Aceitar Meio-Termo</button>
            <button id="btn-neg-force" class="btn btn-warn btn-sm">⚡ Forçar Mesmo Assim</button>
            <button id="btn-neg-cancel" class="btn btn-ghost btn-sm">❌ Recuar</button>
          </div>
        </div>

        <!-- COMMAND CHIPS + INPUT -->
        <div class="composer">
          <div class="cmd-chips">
            <button class="chip" data-cmd="/pray " title="Falar com a Deusa Patrona">🙏 /pray</button>
            <button class="chip" data-cmd="/world " title="Definir ou alterar fatos do mundo">🌍 /world</button>
            <button class="chip" data-cmd="/system " title="Acessar tela do Sistema / opinar">🖥️ /system</button>
            <button class="chip" data-cmd="/mana " title="Falar direto com a Consciência da Mana">💠 /mana</button>
          </div>
          <form id="chat-form" class="chat-form">
            <textarea
              id="chat-input"
              rows="2"
              placeholder="Descreva sua ação, responda ou use /pray, /world, /system, /mana..."
            ></textarea>
            <button id="btn-send" type="submit" class="btn btn-ice send-btn">Enviar</button>
          </form>
        </div>
      </section>

      <!-- TAB: FICHA (/system) -->
      <section id="tab-sheet" class="panel">
        <div id="sheet-content" class="scroll-pad"></div>
      </section>

      <!-- TAB: QUESTS -->
      <section id="tab-quests" class="panel">
        <div id="quests-content" class="scroll-pad"></div>
      </section>

      <!-- TAB: COMPÊNDIO -->
      <section id="tab-compendium" class="panel">
        <div class="subtabs">
          <button class="subtab active" data-comp="npcs">👤 NPCs</button>
          <button class="subtab" data-comp="bestiary">👹 Bestiário</button>
          <button class="subtab" data-comp="concepts">🌌 Conceitos</button>
          <button class="subtab" data-comp="chapters">📚 Capítulos</button>
        </div>
        <div class="search-row">
          <input id="compendium-search" type="search" placeholder="Filtrar descobertas..." />
        </div>
        <div id="compendium-content" class="scroll-pad"></div>
      </section>

      <!-- TAB: MAPA ESFÉRICO -->
      <section id="tab-map" class="panel">
        <div class="map-toolbar">
          <select id="sphere-select" class="select-input"></select>
          <div class="map-zoom-btns">
            <button id="btn-zoom-in" class="icon-btn" title="Aproximar">➕</button>
            <button id="btn-zoom-out" class="icon-btn" title="Afastar">➖</button>
            <button id="btn-globe-reset" class="icon-btn" title="Centralizar">⟲</button>
          </div>
        </div>
        <div class="globe-wrap">
          <canvas id="globe-canvas"></canvas>
          <div class="globe-hint">Arraste para girar a esfera · Pinça/➕➖ para zoom · Toque num nó</div>
        </div>
        <div id="map-node-card" class="node-card">
          <div class="muted">Toque em um ponto descoberto na esfera para ver detalhes.</div>
        </div>
      </section>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="chat">💬<span>Chat</span></button>
      <button class="nav-btn" data-tab="sheet">📊<span>Ficha</span></button>
      <button class="nav-btn" data-tab="quests">📜<span>Quests</span></button>
      <button class="nav-btn" data-tab="compendium">📖<span>Compêndio</span></button>
      <button class="nav-btn" data-tab="map">🌐<span>Mapa</span></button>
    </nav>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>⚙️ Configurações, APIs & Save</h2>
        <button id="btn-close-settings" class="icon-btn">✖</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="cfg-gemini-key">🔑 Gemini API Key (salva só neste aparelho)</label>
          <input id="cfg-gemini-key" type="password" placeholder="AIza..." />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="cfg-gemini-model">Modelo Gemini</label>
            <select id="cfg-gemini-model">
              <option value="gemini-2.5-flash">gemini-2.5-flash (Recomendado)</option>
              <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite (Mais cota)</option>
              <option value="gemini-2.0-flash">gemini-2.0-flash</option>
            </select>
          </div>
          <div class="form-group">
            <label for="cfg-gemini-rpd">Limite diário (RPD)</label>
            <input id="cfg-gemini-rpd" type="number" min="10" max="10000" value="250" />
          </div>
        </div>
        <div class="form-group">
          <label for="cfg-gemini-tpd">Limite diário estimado de Tokens (TPD)</label>
          <input id="cfg-gemini-tpd" type="number" min="10000" step="50000" value="1000000" />
        </div>

        <hr class="sep" />

        <div class="form-group">
          <label for="cfg-sb-url">🗄️ Supabase Project URL</label>
          <input id="cfg-sb-url" type="url" placeholder="https://xxxx.supabase.co" />
        </div>
        <div class="form-group">
          <label for="cfg-sb-key">Supabase Publishable / Anon Key</label>
          <input id="cfg-sb-key" type="password" placeholder="sb_publishable_... ou eyJ..." />
        </div>
        <div class="form-group">
          <label for="cfg-slot-id">Slot ID da Campanha (segredo p/ sincronizar PC ↔ Celular)</label>
          <input id="cfg-slot-id" type="text" placeholder="white-demon-01" />
        </div>
        <div class="btn-row">
          <button id="btn-sb-pull" class="btn btn-ghost btn-sm">⬇️ Baixar do Supabase</button>
          <button id="btn-sb-push" class="btn btn-mana btn-sm">⬆️ Enviar p/ Supabase</button>
        </div>

        <hr class="sep" />

        <div class="quota-detail-box" id="quota-detail-box"></div>

        <div class="btn-row">
          <button id="btn-export-save" class="btn btn-ghost btn-sm">💾 Exportar Save (.json)</button>
          <label class="btn btn-ghost btn-sm file-label">
            📂 Importar JSON
            <input id="input-import-save" type="file" accept=".json,application/json" hidden />
          </label>
        </div>

        <div class="btn-row" style="margin-top: 10px;">
          <button id="btn-new-game" class="btn btn-danger btn-sm">🔄 Reiniciar Jornada (Novo Prólogo)</button>
          <button id="btn-save-settings" class="btn btn-ice">Salvar Configurações</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
